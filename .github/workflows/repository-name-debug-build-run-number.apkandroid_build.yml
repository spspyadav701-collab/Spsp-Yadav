4. Firebase Storage Upload Repository

This repository exposes an asynchronous Kotlin Flow to track byte transfers and download URLs in real time:

codeKotlin

package com.example.streaming.data import android.net.Uri import com.google.firebase.storage.FirebaseStorage import kotlinx.coroutines.channels.awaitClose import kotlinx.coroutines.flow.Flow import kotlinx.coroutines.flow.callbackFlow import java.util.UUID sealed interface UploadState { data object Idle : UploadState data class Progress(val percentage: Int, val bytesTransferred: Long, val totalBytes: Long) : UploadState data class Success(val downloadUrl: String, val fileName: String) : UploadState data class Error(val message: String) : UploadState } class FirebaseVideoRepository( private val storage: FirebaseStorage = FirebaseStorage.getInstance() ) { fun uploadVideo(fileUri: Uri, folder: String = "videos"): Flow<UploadState> = callbackFlow { val fileName = "${UUID.randomUUID()}.mp4" val storageRef = storage.reference.child("$folder/$fileName") trySend(UploadState.Progress(0, 0, 0)) val uploadTask = storageRef.putFile(fileUri) uploadTask.addOnProgressListener { snapshot -> val totalBytes = snapshot.totalByteCount val transferred = snapshot.bytesTransferred val progress = if (totalBytes > 0) ((transferred * 100) / totalBytes).toInt() else 0 trySend(UploadState.Progress(progress, transferred, totalBytes)) }.addOnSuccessListener { storageRef.downloadUrl.addOnSuccessListener { uri -> trySend(UploadState.Success(uri.toString(), fileName)) close() }.addOnFailureListener { exc -> trySend(UploadState.Error("Failed getting download URL: ${exc.localizedMessage}")) close() } }.addOnFailureListener { exc -> trySend(UploadState.Error("Upload failed: ${exc.localizedMessage}")) close() } awaitClose { uploadTask.cancel() } } }

5. Embedded Media Streaming Server & CameraX Pipeline

This component captures camera frames and runs an embedded Ktor HTTP server that broadcasts a live MJPEG stream over your Wi-Fi/LAN:

codeKotlin

package com.example.streaming.stream import android.content.Context import android.graphics.Bitmap import android.graphics.ImageFormat import android.graphics.Rect import android.graphics.YuvImage import androidx.camera.core.* import androidx.camera.lifecycle.ProcessCameraProvider import androidx.camera.view.PreviewView import androidx.core.content.ContextCompat import androidx.lifecycle.LifecycleOwner import io.ktor.http.* import io.ktor.server.application.* import io.ktor.server.cio.* import io.ktor.server.engine.* import io.ktor.server.response.* import io.ktor.server.routing.* import kotlinx.coroutines.* import kotlinx.coroutines.flow.MutableSharedFlow import java.io.ByteArrayOutputStream import java.net.Inet4Address import java.net.NetworkInterface import java.util.concurrent.Executors class EmbeddedCameraStreamManager(private val context: Context) { private val frameFlow = MutableSharedFlow<ByteArray>(extraBufferCapacity = 1) private var serverEngine: ApplicationEngine? = null private val serverPort = 8080 private var isStreaming = false /** * Binds CameraX with ImageAnalysis for frame extraction */ fun startCamera( lifecycleOwner: LifecycleOwner, previewView: PreviewView, onReady: (String) -> Unit ) { val cameraProviderFuture = ProcessCameraProvider.getInstance(context) val executor = Executors.newSingleThreadExecutor() cameraProviderFuture.addListener({ val cameraProvider = cameraProviderFuture.get() val preview = Preview.Builder().build().also { it.surfaceProvider = previewView.surfaceProvider } val imageAnalysis = ImageAnalysis.Builder() .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST) .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_YUV_420_888) .build() imageAnalysis.setAnalyzer(executor) { imageProxy -> if (isStreaming) { val jpegBytes = imageProxyToJpeg(imageProxy) jpegBytes?.let { frameFlow.tryEmit(it) } } imageProxy.close() } cameraProvider.unbindAll() cameraProvider.bindToLifecycle( lifecycleOwner, CameraSelector.DEFAULT_BACK_CAMERA, preview, imageAnalysis ) startEmbeddedServer() val streamUrl = "http://${getLocalIpAddress()}:$serverPort/live" onReady(streamUrl) }, ContextCompat.getMainExecutor(context)) } /** * Starts the embedded Ktor HTTP server serving the live video feed */ private fun startEmbeddedServer() { if (serverEngine != null) return isStreaming = true serverEngine = embeddedServer(CIO, port = serverPort) { routing { get("/live") { call.response.header("Cache-Control", "no-cache, no-store, must-revalidate") call.respondOutputStream( contentType = ContentType.parse("multipart/x-mixed-replace; boundary=--frame") ) { try { frameFlow.collect { jpeg -> write("--frame\r\n".toByteArray()) write("Content-Type: image/jpeg\r\n".toByteArray()) write("Content-Length: ${jpeg.size}\r\n\r\n".toByteArray()) write(jpeg) write("\r\n".toByteArray()) flush() } } catch (e: Exception) { // Client disconnected } } } } }.start(wait = false) } fun stop() { isStreaming = false serverEngine?.stop(1000, 2000) serverEngine = null } private fun imageProxyToJpeg(image: ImageProxy): ByteArray? { val planes = image.planes val yBuffer = planes[0].buffer val uBuffer = planes[1].buffer val vBuffer = planes[2].buffer val ySize = yBuffer.remaining() val uSize = uBuffer.remaining() val vSize = vBuffer.remaining() val nv21 = ByteArray(ySize + uSize + vSize) yBuffer.get(nv21, 0, ySize) vBuffer.get(nv21, ySize, vSize) uBuffer.get(nv21, ySize + vSize, uSize) val yuvImage = YuvImage(nv21, ImageFormat.NV21, image.width, image.height, null) val out = ByteArrayOutputStream() yuvImage.compressToJpeg(Rect(0, 0, image.width, image.height), 75, out) return out.toByteArray() } private fun getLocalIpAddress(): String { NetworkInterface.getNetworkInterfaces().toList().forEach { nInterface -> nInterface.inetAddresses.toList().forEach { address -> if (!address.isLoopbackAddress && address is Inet4Address) { return address.hostAddress ?: "127.0.0.1" } } } return "127.0.0.1" } }

